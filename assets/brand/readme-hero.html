<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>html,body{margin:0}
.frame{width:1280px;height:340px;display:flex;align-items:center;gap:48px;padding:0 72px}
.right{display:flex;flex-direction:column;gap:20px;flex:1}
.top{display:flex;align-items:baseline;gap:18px}
.hl{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:34px;line-height:1.3;max-width:30ch}
.hl em{font-style:italic;color:var(--clay)}
.chips{display:flex;gap:11px;flex-wrap:wrap}
.chip{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--ink-2);
  background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:8px 15px}
.cmd{font-size:17px;padding:12px 20px;align-self:flex-start}
</style></head><body>
<div class="frame glow"><span class="mark" style="width:172px;height:172px;flex:none"></span>
  <div class="right">
    <div class="top"><div class="wordmark" style="font-size:60px;line-height:1.0">ytmt</div><span class="descriptor" style="font-size:13px">yt-dlp &middot; media tools</span></div>
    <div class="cmd"><span class="sigil">$</span>brew install corado-bogos/tap/ytmt</div>
    <div class="chips"><span class="chip">Guided wizard</span><span class="chip">MP4 &middot; MP3 &middot; FLAC</span><span class="chip">Playlists</span><span class="chip">Browser cookies</span><span class="chip">macOS</span></div>
  </div>
</div></body></html>
