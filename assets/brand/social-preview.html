<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>html,body{margin:0}
.frame{width:1280px;height:640px;display:flex;flex-direction:column;justify-content:center;padding:0 92px;gap:34px}
.tag{font-family:var(--sans);font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--clay);font-size:17px}
.hl{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:70px;line-height:1.05;letter-spacing:-.015em;max-width:15ch}
.hl em{font-style:italic;color:var(--clay)}
.cmd{font-size:22px;padding:14px 24px}
.foot{position:absolute;right:92px;bottom:54px;display:flex;align-items:center;gap:20px}
.foot .wordmark{font-size:40px}
.repo{position:absolute;left:92px;bottom:56px;font-family:var(--sans);font-weight:500;color:var(--muted);font-size:18px}
.orb{position:absolute;top:-160px;right:-120px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--clay-2),var(--clay) 55%,var(--clay-deep));opacity:.14}
</style></head><body>
<div class="frame glow"><div class="orb"></div>
  <div style="display:flex;align-items:center;gap:24px"><span class="mark" style="width:96px;height:96px"></span><div class="tag" style="margin-top:4px">yt-dlp &middot; media tools</div></div>
  <div class="hl">Download video &amp; audio, the <em>simple</em> way.</div>
  <div class="cmd"><span class="sigil">$</span>brew install corado-bogos/tap/ytmt</div>
  <div class="repo">github.com/corado-bogos/yt-dlp-media-tools</div>
  <div class="foot"><div class="wordmark" style="font-size:40px;line-height:1.0">ytmt</div></div>
</div></body></html>
