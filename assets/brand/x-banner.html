<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>html,body{margin:0}
.frame{width:1500px;height:500px;display:flex;align-items:center;justify-content:flex-end;padding:0 120px 0 0}
.orbwrap{position:absolute;left:0;top:0;bottom:0;width:560px;display:grid;place-items:center}
.big{width:300px;height:300px;filter:drop-shadow(0 24px 60px rgba(162,75,44,.28))}
.right{display:flex;flex-direction:column;gap:22px;align-items:flex-end;text-align:right;max-width:760px}
.hl{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:60px;line-height:1.05;letter-spacing:-.015em}
.hl em{font-style:italic;color:var(--clay)}
.chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--ink-2);
  background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.handle{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:17px}
.gA{position:absolute;top:-200px;left:120px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,var(--clay-2),var(--clay) 55%);opacity:.12}
</style></head><body>
<div class="frame glow"><div class="gA"></div>
  <div class="orbwrap"><span class="mark big"></span></div>
  <div class="right">
    <div class="hl">Download video &amp; audio,<br>the <em>simple</em> way.</div>
    <div class="chips"><span class="chip">MP4</span><span class="chip">MP3</span><span class="chip">FLAC</span><span class="chip">Playlists</span><span class="chip">macOS</span></div>
    <div class="handle">github.com/corado-bogos/yt-dlp-media-tools</div>
  </div>
</div></body></html>
